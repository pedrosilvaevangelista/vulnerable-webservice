services:
  web:
    build: .
    container_name: vulnerable_web
    user: root
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    command: sh -c "echo '🛡️  Servidor Web Vulnerable iniciado, Invada Se for capaz!!!'; apache2-foreground"
    depends_on:
      - db
    networks:
      - lab_network

  db:
    image: mysql:5.7
    container_name: vulnerable_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: azul_db
    volumes:
      - db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql
    networks:
      - lab_network

volumes:
  db_data:

networks:
  lab_network:
    driver: bridge
    internal: false

